<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Travel Photography Portfolio — Login</title>
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #111;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #333;
            max-width: 380px;
            width: 100%;
        }

        h1 {
            font-size: 22px;
            color: #fff;
            margin-bottom: 6px;
            font-weight: 600;
        }

        /* Heading that turns into a contact note on hover (or tap/focus on touch):
           both lines share one grid cell, so the box keeps the taller one's height. */
        .login-title {
            position: relative;
            display: grid;
            cursor: default;
            outline: none;
            padding-bottom: 8px;
            line-height: 1.25;
        }
        .login-title > span {
            grid-area: 1 / 1;
            transition: opacity .35s ease, transform .35s ease;
        }
        .login-title .title-contact {
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
            font-size: 15px;
            font-weight: 500;
            color: #d1d5db;
            align-self: center;
        }
        .login-title .title-contact a { color: #fff; text-decoration: none; border-bottom: 1px solid #e11d48; }
        .login-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            height: 2px;
            width: 100%;
            background: #e11d48;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .4s ease;
        }
        .login-title:hover .title-main,
        .login-title:focus-within .title-main { opacity: 0; transform: translateY(-10px); }
        .login-title:hover .title-contact,
        .login-title:focus-within .title-contact { opacity: 1; transform: none; pointer-events: auto; }
        .login-title:hover::after,
        .login-title:focus-within::after { transform: scaleX(1); }
        @media (prefers-reduced-motion: reduce) {
            .login-title > span, .login-title::after { transition: none; }
        }

        p {
            color: #888;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 13px;
            font-weight: 500;
        }

        input[type="password"] {
            width: 100%;
            padding: 11px 14px;
            background: #222;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 15px;
            color: #fff;
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: #e11d48;
        }

        button {
            width: 100%;
            padding: 11px;
            background: #e11d48;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background: #be123c; }

        .error {
            color: #f87171;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .qr-status {
            color: #d1d5db;
            font-size: 14px;
            margin-bottom: 14px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1 class="login-title" tabindex="0">
            <span class="title-main">Travel / Photography / Exploring Portfolio</span>
            <span class="title-contact">Contact <a href="mailto:ryanmcloughlin20@gmail.com">ryanmcloughlin20@gmail.com</a> for access</span>
        </h1>
        <p>Enter password to continue</p>

        <form method="POST" action="/auth">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autofocus required placeholder="••••••••">
            <script>
                if (new URLSearchParams(location.search).get('error')) {
                    document.write('<div class="error">Incorrect password.</div>');
                }
            </script>
            <button type="submit">Enter</button>
        </form>
    </div>
    <script>
        // A QR invitation stores its token in the fragment so it is not sent in
        // the initial request, browser history, referrers, or ordinary access logs.
        // Exchange it for the normal HttpOnly login cookie, then clean the URL.
        (async () => {
            const token = new URLSearchParams(location.hash.slice(1)).get('qr');
            if (!token) return;

            history.replaceState(null, '', location.pathname);
            const form = document.querySelector('form');
            const status = document.createElement('div');
            status.className = 'qr-status';
            status.setAttribute('role', 'status');
            status.textContent = 'Opening your invitation…';
            form.before(status);
            form.hidden = true;

            try {
                const response = await fetch('/auth-qr', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ token })
                });
                if (!response.ok) throw new Error('Invalid invitation');
                location.replace('/');
            } catch {
                status.className = 'error';
                status.textContent = 'This invitation is invalid or has been replaced.';
                form.hidden = false;
            }
        })();
    </script>
</body>
</html>
